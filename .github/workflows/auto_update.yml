name: Auto update game manifests

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

# Nothing is granted by default; the job below asks only for what it needs.
permissions: {}

# Never let two runs race each other on the same files.
concurrency:
  group: auto-update-manifests
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # push validated manifests
      pull-requests: write   # only used when the PUSH_MODE variable is "pr"
    steps:
      # Action versions follow upstream PR #181 (Node 24 runtimes). For an organization we recommend pinning
      # each action to a full commit SHA and letting Dependabot bump them (see docs/SECURITY.md).
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run unit tests
        run: npm test

      - name: Create generated folder
        run: mkdir -p scripts/generated

      # The list of manifests comes from ONE place (repository.json) for staging and for moving back. Upstream
      # had two hand-written lists that drifted apart, which made a generator start from an empty file.
      - name: Stage existing manifests
        run: |
          for f in $(jq -r '.manifests[]' repository.json); do
            if [ -f "$f" ]; then cp "$f" "scripts/generated/$f"; fi
          done

      - name: Run generators
        run: |
          for script in scripts/*.js; do
            echo "======================================"
            echo "Running script: $script"
            echo "--------------------------------------"
            # run: steps use bash -e, so catch the exit code or one failing vendor aborts every other one
            node "$script" append && status=0 || status=$?
            if [ $status -eq 0 ]; then
              echo "Script $script completed successfully."
            else
              echo "::warning::Script $script failed with exit code $status, its manifests were left as they were."
            fi
            echo "======================================"
            echo
          done

      - name: Move generated JSONs to root
        run: |
          for f in $(jq -r '.manifests[]' repository.json); do
            if [ -f "scripts/generated/$f" ]; then mv "scripts/generated/$f" "$f"; fi
          done

      - name: Validate manifests
        id: validate
        run: node .github/scripts/validate_manifests.js

      - name: Detect changes
        id: git-diff
        run: |
          if [ -n "$(git status --porcelain -- $(jq -r '.manifests[]' repository.json))" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Direct push safe manifests
        if: steps.git-diff.outputs.changed == 'true' && vars.PUSH_MODE != 'pr'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $(jq -r '.manifests[]' repository.json)
          git commit -m "Automated: Update game manifests"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create Pull Request
        if: steps.git-diff.outputs.changed == 'true' && vars.PUSH_MODE == 'pr'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Automated: Update game manifests"
          branch: "game-manifests/auto-update"
          base: main
          title: "Automated: Update game manifests"
          body: "Review this PR to merge updated game manifests."
          add-paths: "*.json"

      # Make rejected manifests visible (red run + notification) instead of discovering them by accident.
      - name: Fail if a manifest was rejected
        if: steps.validate.outputs.rejected != ''
        env:
          REJECTED: ${{ steps.validate.outputs.rejected }}
        run: |
          echo "::error::Rejected and kept the committed version of: ${REJECTED}"
          exit 1
